name: build-apps
# Run from the Actions tab ("Run workflow") to build the apps. A manual run also publishes them
# as a pre-release called "build-<run number>" on the Releases page.
# Push a tag like v1.1 to publish a normal release instead.
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: tp7-windows
          path: |
            dist/tp7-setup.exe
            dist/tp7-portable.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # Capacitor 8 compiles against API 36; make sure the SDK pieces and licences are present.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: npm install
      - run: npx cap add android

      - name: Microphone permission (for the REC key)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"
          grep -q RECORD_AUDIO "$M" || { echo "::error::could not add the microphone permission to $M"; cat "$M"; exit 1; }

      # Media notification + not crashing when Android reclaims memory (see android-overrides/MainActivity.java).
      - name: Notification permissions and MainActivity override
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          # Android 14+ refuses to start a media foreground service without its own permission (the app would crash on first play);
          # Android 13+ only shows notifications once POST_NOTIFICATIONS is granted (MainActivity asks for it).
          sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' "$M"
          for p in FOREGROUND_SERVICE_MEDIA_PLAYBACK POST_NOTIFICATIONS; do
            grep -q "$p" "$M" || { echo "::error::could not add $p to $M"; cat "$M"; exit 1; }
          done
          D=android/app/src/main/java/dev/tp7/player
          test -f "$D/MainActivity.java" || { echo "::error::generated MainActivity.java not found"; find android/app/src -name '*.java'; exit 1; }
          cp android-overrides/MainActivity.java "$D/MainActivity.java"

      # Uses assets/icon-only.png, icon-foreground.png and icon-background.png.
      # Cosmetic only, so a failure here is a warning, but the next step makes sure it can't leave a broken res tree.
      - name: Generate launcher icons
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#161616' --iconBackgroundColorDark '#161616'

      # Gradle's resource linking fails if an adaptive icon references an image that wasn't generated
      # (e.g. "resource mipmap/ic_launcher_background not found"). If any reference is dangling, drop the
      # adaptive icon XMLs so the regular ic_launcher.png icons are used instead.
      - name: Verify launcher icon resources
        run: |
          R=android/app/src/main/res
          for x in "$R"/mipmap-anydpi-v26/ic_launcher.xml "$R"/mipmap-anydpi-v26/ic_launcher_round.xml; do
            [ -f "$x" ] || continue
            for ref in $(grep -oE '@(mipmap|drawable)/[A-Za-z0-9_]+' "$x" | sort -u); do
              kind=${ref#@}; kind=${kind%%/*}; name=${ref##*/}
              if ! compgen -G "$R/$kind-*/$name.*" >/dev/null && ! compgen -G "$R/$kind/$name.*" >/dev/null; then
                echo "::warning::$x references missing $ref - removing the adaptive icon, the standard icon will be used"
                rm -f "$x"; break
              fi
            done
          done
          ls -R "$R" | grep -i launcher || true

      - run: npx cap sync android

      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: false }
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk tp7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tp7-android-apk
          path: tp7.apk
          if-no-files-found: error

      # If the build breaks, keep the Gradle reports so the real error can be read.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-reports
          path: |
            android/app/build/reports
            android/build/reports
          if-no-files-found: ignore

  release:
    needs: [windows, android]
    # Publish whatever built successfully, even if the other platform failed.
    # (Without this, one failed job makes GitHub skip the release job entirely.)
    if: >-
      ${{ !cancelled()
      && (needs.windows.result == 'success' || needs.android.result == 'success')
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
          # skip the diagnostic reports artifact
          pattern: tp7-*
      - run: ls -lR out
      - uses: softprops/action-gh-release@v2
        with:
          # tag push -> release for that tag; manual run -> pre-release "build-<n>" on this commit
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: out/*
          fail_on_unmatched_files: true
